<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KIS</title>
<meta name="theme-color" content="#3D5AFE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KIS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg:#F6F5F2; --surface:#FFFFFF; --text:#1C1B1F; --muted:#6B6872; --accent:#3D5AFE; --listening:#2E7D32; --speaking:#EF6C00; --late:#C62828; --today:#EF6C00; --line:#E7E5E0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141317; --surface:#1F1E23; --text:#ECEAF0; --muted:#A09DA8; --accent:#8C9EFF; --line:#2E2D33; --late:#EF5350; --today:#FFA726; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { padding:env(safe-area-inset-top) 16px calc(150px + env(safe-area-inset-bottom)); max-width:640px; margin:0 auto; }
  header { display:flex; align-items:center; gap:10px; padding:16px 0 8px; }
  header img { width:36px; height:36px; border-radius:10px; }
  header h1 { font-size:22px; margin:0; flex:1; }
  #heard { color:var(--muted); min-height:1.4em; margin:4px 0 12px; }
  #install { display:none; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px; font-size:14px; }
  ul { list-style:none; padding:0; margin:0; }
  li { display:flex; align-items:center; gap:12px; background:var(--surface); border-radius:14px; padding:12px 14px; margin-bottom:8px; border:1px solid var(--line); }
  li .num { width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; font-size:14px; font-weight:600; flex:none; }
  li .body { flex:1; min-width:0; }
  li .title { font-weight:600; overflow-wrap:anywhere; }
  li .due { font-size:13px; color:var(--muted); }
  li.late .due { color:var(--late); font-weight:600; } li.today .due { color:var(--today); }
  li.done .title { text-decoration:line-through; color:var(--muted); } li.done .num { background:var(--muted); }
  li button { background:none; border:0; color:var(--muted); font-size:20px; padding:4px 6px; cursor:pointer; }
  h2 { font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin:20px 0 8px; }
  .empty { color:var(--muted); text-align:center; padding:32px 0; }
  #bar { position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(16px + env(safe-area-inset-bottom)); background:linear-gradient(transparent, var(--bg) 30%); display:flex; flex-direction:column; align-items:center; gap:10px; }
  #mic { width:76px; height:76px; border-radius:50%; border:0; background:var(--accent); color:#fff; box-shadow:0 6px 18px rgba(61,90,254,.35); cursor:pointer; display:grid; place-items:center; }
  #mic.listening { background:var(--listening); animation:pulse 1.2s infinite; } #mic.speaking { background:var(--speaking); }
  @keyframes pulse { 50% { transform:scale(1.07); } }
  #mic svg { width:34px; height:34px; }
  form { display:flex; gap:8px; width:100%; max-width:640px; }
  form input { flex:1; font-size:16px; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--text); }
  dialog { border:0; border-radius:16px; background:var(--surface); color:var(--text); width:min(92vw,420px); padding:18px; }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  dialog label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  dialog input { width:100%; font-size:16px; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  dialog .row { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
  dialog button { font-size:15px; padding:9px 14px; border-radius:10px; border:0; background:var(--line); color:var(--text); cursor:pointer; }
  dialog button.primary { background:var(--accent); color:#fff; }
</style>
</head>
<body>
<header><img src="icon.svg" alt=""><h1>KIS</h1><button id="notif" title="Activer les rappels" style="background:none;border:0;font-size:22px;cursor:pointer">🔔</button></header>
<div id="install">Pour l'installer : touchez <b>Partager</b> puis <b>Sur l'écran d'accueil</b>. Les rappels ne marchent sur iPhone qu'une fois l'app installée.</div>
<div id="heard">Touchez le micro et dites par ex. « appeler Paul demain à 18h »</div>
<ul id="list"></ul>
<h2 id="doneTitle" hidden>Terminées</h2>
<ul id="done"></ul>
<div id="bar">
  <button id="mic" aria-label="Parler"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></button>
  <form id="form"><input id="input" placeholder="Ou tapez une tâche ou une commande" enterkeyhint="send" autocomplete="off"></form>
</div>
<dialog id="edit"><form method="dialog">
  <b>Modifier la tâche</b>
  <label for="eTitle">Titre</label><input id="eTitle">
  <label for="eDue">Échéance</label><input id="eDue" type="datetime-local">
  <div class="row"><button value="cancel">Annuler</button><button value="ok" class="primary">Enregistrer</button></div>
</form></dialog>
<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
