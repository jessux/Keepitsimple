name: APK

# À chaque push sur main : tests, build de l'APK et publication dans la release v<versionName>
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests et build
        run: ./gradlew testDebugUnitTest assembleDebug
      - name: Version
        id: version
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Renomme l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk kis-${{ steps.version.outputs.name }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: KIS ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: kis-${{ steps.version.outputs.name }}.apk
